name: Auto-enqueue

# Każdy GOTOWY PR trafia do kolejki merge'ów sam (wzór: auto-enqueue.yml w NEXUSIE, 22.09.2026).
# „Gotowy” = nie-draft, bez etykiety `wstrzymaj`, autor nie jest Dependabotem (podbija też wersje
# główne — to decyzja człowieka). Chcesz, żeby PR NIE wszedł sam? Draft albo etykieta `wstrzymaj`.
#
# TOKEN: `secrets.QUEUE_BOT_TOKEN` (fine-grained PAT: to repo, Contents + Pull requests: Read and write).
# NIE `GITHUB_TOKEN` — zdarzenia wywołane tokenem Actions nie uruchamiają innych workflowów, więc grupa
# w kolejce nie dostałaby testów (`merge_group`) i wisiałaby do timeoutu. Bez sekretu workflow tylko
# wypisuje ostrzeżenie i nic nie robi.
#
# `gh pr merge --auto` przy kolejce merge'ów = „dodaj do kolejki, gdy wymagane checki PR-a będą zielone”.
#
# WSTRZYMANIE: etykieta `wstrzymaj` albo „Convert to draft” dodane PÓŹNIEJ wyłączają auto-merge i zdejmują
# PR z trwającej kolejki (job `hold`, GraphQL `dequeuePullRequest`). Zdjęcie etykiety (`unlabeled`)
# albo „Ready for review” wrzuca PR z powrotem.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, unlabeled, labeled, converted_to_draft]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-enqueue-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enqueue:
    name: Dodaj do kolejki merge'ów
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.action != 'labeled'
      && github.event.action != 'converted_to_draft'
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && !contains(github.event.pull_request.labels.*.name, 'wstrzymaj') }}
    steps:
      - name: Włącz auto-merge (kolejka)
        env:
          GH_TOKEN: ${{ secrets.QUEUE_BOT_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Brak sekretu QUEUE_BOT_TOKEN — PR #$PR nie został dodany do kolejki automatycznie. Instrukcja: docs/ci/README.md."
            exit 0
          fi
          # Stan PR-a TERAZ, nie z chwili zdarzenia: etykiety w `github.event` to migawka
          # (NEXUS 24.09.2026: push wyprzedził `wstrzymaj` i PR wszedł do kolejki mimo wstrzymania).
          if ! live=$(gh pr view "$PR" --repo "$REPO" --json isDraft,labels \
                --jq '[.isDraft, ([.labels[].name] | index("wstrzymaj") != null)] | @tsv'); then
            echo "::notice::PR #$PR: nie udało się odczytać bieżącego stanu — nie włączam auto-merge'a."
            exit 0
          fi
          if [ "$live" != "false	false" ]; then
            echo "PR #$PR: draft albo \`wstrzymaj\` w bieżącym stanie (draft, wstrzymaj = $live) — pomijam."
            exit 0
          fi
          if out=$(gh pr merge "$PR" --repo "$REPO" --squash --auto 2>&1); then
            echo "PR #$PR: auto-merge włączony — wejdzie do kolejki po zielonych checkach."
            echo "$out"
          else
            # Najczęściej: PR już w kolejce albo ma konflikt z mainem — informacja, nie awaria.
            echo "::notice::PR #$PR nie został dodany do kolejki: $out"
          fi

  hold:
    name: Wstrzymaj (zdejmij z kolejki)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      ${{ github.event.action == 'converted_to_draft'
      || (github.event.action == 'labeled' && github.event.label.name == 'wstrzymaj') }}
    steps:
      - name: Wyłącz auto-merge i zdejmij z kolejki merge'ów
        env:
          GH_TOKEN: ${{ secrets.QUEUE_BOT_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Brak sekretu QUEUE_BOT_TOKEN — PR #$PR NIE został zdjęty z kolejki. Zrób to ręcznie: gh pr merge $PR --disable-auto."
            exit 0
          fi
          if out=$(gh pr merge "$PR" --repo "$REPO" --disable-auto 2>&1); then
            echo "PR #$PR: auto-merge wyłączony."
          else
            echo "::notice::PR #$PR: auto-merge nie był włączony albo nie dał się wyłączyć: $out"
          fi
          # PR już w kolejce: wyłączenie auto-merge'a go nie wyjmuje — stąd jawne zdjęcie z kolejki.
          # `$id` to zmienna GraphQL, nie powłoki — pojedyncze cudzysłowy są celowe.
          # shellcheck disable=SC2016
          if out=$(gh api graphql \
                -f query='mutation($id: ID!) { dequeuePullRequest(input: {id: $id}) { mergeQueueEntry { id } } }' \
                -f id="$PR_NODE_ID" 2>&1); then
            echo "PR #$PR: zdjęty z kolejki merge'ów."
          else
            echo "::notice::PR #$PR nie był w kolejce merge'ów (albo nie dało się go zdjąć): $out"
          fi
