name: Security scan

# Trivy (dependencies) and hadolint (demo Dockerfile), advisory as on the other repositories (ci-cd-unified):
# not a required check; findings are uploaded as an artifact and shown as annotations, so they can be triaged.
on:
  pull_request:
    paths:
      - "package-lock.json"
      - "tools/demo/render/Dockerfile"
      - ".trivyignore"
      - ".github/workflows/security-scan.yml"
  push:
    branches: [main]
    paths:
      - "package-lock.json"
      - "tools/demo/render/Dockerfile"
      - ".trivyignore"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Trivy + hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hadolint (demo image)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: tools/demo/render/Dockerfile
          failure-threshold: warning
        continue-on-error: true
      - name: Trivy (npm dependencies, HIGH/CRITICAL with a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy.txt
          exit-code: "0"
      - name: Show Trivy findings
        if: always()
        run: |
          if [ -s trivy.txt ]; then
            cat trivy.txt
            n=$(grep -cE '\b(HIGH|CRITICAL)\b' trivy.txt || true)
            [ "${n:-0}" -eq 0 ] || echo "::warning::Trivy: ${n} HIGH/CRITICAL lines with a fix available (see the artifact)"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-report
          path: trivy.txt
          if-no-files-found: ignore
