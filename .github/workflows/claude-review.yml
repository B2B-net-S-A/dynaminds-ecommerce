name: Claude review

# Automated Claude Code review of every PR (standard ci-cd-unified, decision of 21.05.2026). INERT until activated:
#   1. `claude setup-token` (Max subscription) -> repo secret CLAUDE_CODE_OAUTH_TOKEN
#   2. repo variable CLAUDE_ENABLED = 'true' (kill-switch: set it to 'false')
# Not a required check: when the switch is off it does not run, and a required context would block every merge.
# The repository is public, so only PRs from branches of this repository are reviewed: a PR from a fork never gets
# the token (pull_request from forks has no secrets) and its content is untrusted input for the model.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Dependabot runs get only Dependabot secrets (none here, so no Claude token): skip instead of a red job.
    if: >-
      vars.CLAUDE_ENABLED == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # dynaminds-codex-bot pushes the commits of Claude sessions; without this entry the actor check fails the
          # job (a rerun keeps the actor). Deliberately one named bot, not '*' (as on COMPASS and ATLAS).
          allowed_bots: "dynaminds-codex-bot"
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for bugs, security issues, and missing test
            coverage. Be concise — only flag real problems and cite file:line.
            Skip style nitpicks. Use inline comments for specific findings; finish
            with a short summary of your overall verdict.

            Work within a turn budget — a review that never posts is worth nothing:
            - Fetch the diff ONCE with `gh pr diff` and review from it. Do not use
              `git diff origin/main...HEAD`; the checkout is shallow (fetch-depth 1)
              and it will fail.
            - Open files with Read only where the diff genuinely lacks the context
              needed to confirm a suspicion. Do not read every changed file.
            - On a large diff, prioritise: SQL migrations in `server/*.sql` and the
              sealed guards (a changed trigger function on `orders` breaks the seal),
              money and stock (payments, invoices, reservations, stock writes),
              tenant isolation and permissions, buyer personal data (GDPR export,
              masking), and public API routes. Skim lockfiles, generated contracts,
              fixtures and pure-formatting hunks.
            - Each inline comment costs a turn. Post at most the 10 most severe
              findings inline; fold the rest into the summary.
            - Post the summary verdict while you still have budget left. If you are
              running out of turns, post what you have — a partial review beats a
              failed job with no output at all.
          # 50 turns, unified on the four repositories on 27.07.2026 (ordinary reviews take 15-23 turns).
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 50
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
