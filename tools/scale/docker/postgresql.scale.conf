# Settings frozen by docs/scale/MEASUREMENT-MANIFEST-20261025.md section 3. Included from postgresql.conf.
listen_addresses = '*'                  # inside the container; the host publishes only 127.0.0.1:57090
port = 5432
max_connections = 100
shared_buffers = 16GB
effective_cache_size = 64GB
work_mem = 32MB
maintenance_work_mem = 2GB
max_wal_size = 16GB
min_wal_size = 2GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
random_page_cost = 1.1
jit = off
timezone = 'UTC'
log_timezone = 'UTC'
fsync = on
synchronous_commit = on
full_page_writes = on
wal_level = replica
archive_mode = on
archive_command = '/usr/local/bin/dyna-wal-archive %p %f'   # zstd + fsync; tools/recovery/README.md
archive_timeout = 60s                   # RPO: a written segment reaches the archive within ~60 s (goal: <=15 min)
autovacuum = on
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
track_io_timing = on
log_min_duration_statement = 1000
