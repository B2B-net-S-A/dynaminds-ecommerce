{
  "name": "${COMPOSE_PROJECT_NAME:?Private owned project name required}",
  "services": {
    "database": {
      "image": "${MARIADB_IMAGE:?Actual arm64 manifest lock required}",
      "platform": "linux/arm64",
      "environment": {
        "MARIADB_ROOT_PASSWORD_FILE": "/run/secrets/db_root"
      },
      "secrets": [
        "db_root"
      ],
      "volumes": [
        "${DYNA_WOO_ROOT:?Run file-only prepare and resolve first}/data/mariadb:/var/lib/mysql",
        "${DYNA_WOO_ROOT:?Run file-only prepare and resolve first}/config/10-stores.sql:/docker-entrypoint-initdb.d/10-stores.sql:ro"
      ],
      "networks": [
        "owned"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 24
      },
      "mem_limit": "768m",
      "cpus": 1.0,
      "logging": {
        "driver": "local",
        "options": {
          "max-size": "2m",
          "max-file": "2"
        }
      }
    },
    "wp-a": {
      "image": "${WORDPRESS_IMAGE:?Actual arm64 manifest lock required}",
      "platform": "linux/arm64",
      "entrypoint": [
        "/bin/sh",
        "-ec",
        "export WORDPRESS_DB_PASSWORD=\"$$(cat /run/secrets/db_password)\"; exec docker-entrypoint.sh apache2-foreground"
      ],
      "environment": {
        "WORDPRESS_DB_HOST": "database:3306",
        "WORDPRESS_DB_NAME": "woo_a",
        "WORDPRESS_DB_USER": "woo_a",
        "WORDPRESS_CONFIG_EXTRA": "define('WP_HTTP_BLOCK_EXTERNAL',true); define('AUTOMATIC_UPDATER_DISABLED',true); define('WP_AUTO_UPDATE_CORE',false); define('DISABLE_WP_CRON',true); define('WP_MEMORY_LIMIT','256M'); if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS']='on'; }",
        "DYNA_WOO_SLOT": "a"
      },
      "secrets": [
        {
          "source": "db_a",
          "target": "db_password"
        }
      ],
      "volumes": [
        "${DYNA_WOO_ROOT:?Run file-only prepare and resolve first}/data/wp-a:/var/www/html",
        "${DYNA_WOO_ROOT:?Run file-only prepare and resolve first}/config/disable-external.php:/var/www/html/wp-content/mu-plugins/dyna-owned-no-mail.php:ro",
        "${DYNA_WOO_ROOT:?Run file-only prepare and resolve first}/config/php.ini:/usr/local/etc/php/conf.d/dyna-owned.ini:ro",
        "${DYNA_WOO_ROOT:?Run file-only prepare and resolve first}/config/apache.conf:/etc/apache2/conf-enabled/dyna-owned.conf:ro"
      ],
      "depends_on": {
        "database": {
          "condition": "service_healthy"
        }
      },
      "networks": [
        "owned"
      ],
      "mem_limit": "512m",
      "cpus": 0.5,
      "logging": {
        "driver": "local",
        "options": {
          "max-size": "2m",
          "max-file": "2"
        }
      }
    },
    "cli-a": {
      "image": "${WPCLI_IMAGE:?Actual arm64 manifest lock required}",
      "platform": "linux/arm64",
      "profiles": [
        "tools"
      ],
      "user": "0:0",
      "entrypoint": [
        "/bin/sh",
        "-ec",
        "export WORDPRESS_DB_PASSWORD=\"$$(cat /run/secrets/db_password)\"; exec wp --allow-root \"$$@\"",
        "wp-cli"
